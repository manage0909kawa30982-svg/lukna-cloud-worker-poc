# Independent test for the LUKNA Cloud Worker PoC.
# - Runs only on pushes to claude/** branches (the Cloud Worker's job branches).
# - Uses a standard GitHub-hosted runner (free for public repositories). No secrets are passed.
# - Read-only token permissions. Does not comment, push, or call external services.
name: independent-test
on:
  push:
    branches: ['claude/**']
permissions:
  contents: read
concurrency:
  group: independent-test-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify protected test file is unchanged from main
        run: |
          git fetch --no-tags --depth=1 origin main
          git diff --exit-code origin/main -- test/ .github/
      - name: Run tests (TAP)
        # shell: bash enables pipefail, so a failing test fails the job even through tee
        shell: bash
        run: node --test --test-reporter=tap test/sum.test.js | tee test-output.tap
      - name: Upload TAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-test-tap
          path: test-output.tap
          retention-days: 7
